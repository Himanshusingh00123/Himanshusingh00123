Absolutely 👍 Here’s the easiest **step-by-step** way to add the Brutalist Slab to your GitHub profile.

### 1. Create/open your GitHub profile repository

Go to [GitHub](https://github.com/?utm_source=chatgpt.com) and sign in.

Your profile repository must have the **exact same name as your GitHub username**.

For example, if your username is:

```text
himansusingh
```

your profile repository should be:

```text
himansusingh/himansusingh
```

If you don't have one yet:

1. Click your **profile picture** → **Your repositories**
2. Click **New**
3. Enter your GitHub username as the repository name.
4. Select **Public**
5. Check **Add a README file**
6. Click **Create repository**

---

### 2. Download the SVG I made

Download this file:

:chatgpt-content-reference{index="2"}[**Download brutalist-slab.svg**](sandbox:/mnt/data/brutalist-slab.svg)

Keep the filename exactly:

```text
brutalist-slab.svg
```

---

### 3. Create an `assets` folder

Inside your GitHub profile repository:

1. Click **Add file**
2. Click **Create new file**
3. In the filename box, type:

```text
assets/brutalist-slab.svg
```

3. Open the SVG file you downloaded.
4. Copy **all of its contents**.
5. Paste it into GitHub's editor.
6. Scroll down.
7. Click **Commit changes**.

Your repository should now look like:

```text
himansusingh/
│
├── README.md
│
└── assets/
    └── brutalist-slab.svg
```

---

### 4. Edit your `README.md`

Go back to your repository's main page.

Click:

**README.md → ✏️ Edit**

Delete the existing README content if you want the new design to be your whole profile.

At the very top, add:

```html
<p align="center">
  <img src="./assets/brutalist-slab.svg"
       alt="Himanshu Singh — Developer"
       width="100%">
</p>
```

Then underneath it, you can add:

```markdown
## WHAT I BUILD

I build things that are fast, useful, and hard to misunderstand.

## WORK

- **Web Development** — clean interfaces and practical applications
- **Open Source** — experiments, tools, and things worth sharing
- **Problem Solving** — turning ideas into working software
```

---

### 5. Commit the README

Scroll to the bottom and click:

**Commit changes**

Then go to your GitHub profile:

```text
https://github.com/YOUR_USERNAME
```

You should see the brutalist banner at the top of your profile.

### Your final structure

```text
YOUR_USERNAME/
│
├── README.md
│
└── assets/
    └── brutalist-slab.svg
```

**Important:** Don't upload the SVG as an image into the README editor. The SVG belongs inside the `assets` folder, and the README displays it using the `<img>` code above.

If you want, I can also make you a **complete premium GitHub README for Himanshu Singh** — banner + About Me + skills + GitHub stats + projects + social links, all matching this brutalist design.
